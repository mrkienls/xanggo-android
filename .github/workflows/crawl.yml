name: Fuel Price Auto Crawler

on:
  schedule:
    # 1. Chạy hàng ngày lúc 07:00 sáng giờ VN (UTC = 00:00) để cập nhật tỷ giá ngoại tệ và kiểm tra giá dịp lễ Tết
    - cron: '0 0 * * *'
    # 2. Riêng chiều Thứ Năm hàng tuần (Kỳ điều hành giá): chạy lúc 15:05, 15:20, 15:40 (UTC = 08:05, 08:20, 08:40)
    - cron: '5,20,40 8 * * 4'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub bất cứ lúc nào

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Crawler
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/crawler.py

      - name: Commit and push updated static JSON if changed
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backend/output/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update fuel prices data [skip ci]" && git push)
